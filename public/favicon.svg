<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Map Base (Tilted Square) -->
  <path d="M60 180 L256 240 L452 180 L452 400 L256 460 L60 400 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" filter="url(#shadow)"/>
  <!-- Grid Lines -->
  <path d="M60 250 L452 250 M60 330 L452 330 M190 220 L190 440 M320 200 L320 420" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- Red Location Pin -->
  <g transform="translate(0, -30)" filter="url(#shadow)">
    <path d="M256 80c-55.2 0-100 44.8-100 100 0 70 100 180 100 180s100-110 100-180c0-55.2-44.8-100-100-100z" fill="#ef4444"/>
    <circle cx="256" cy="180" r="35" fill="#fff"/>
  </g>
</svg>
