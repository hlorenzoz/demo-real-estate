<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 3D Map Base -->
  <g filter="url(#shadow)">
    <!-- Bottom layer -->
    <path d="M60 400 L256 480 L452 400 L256 320 Z" fill="#94A3B8" />
    <!-- Top map layer with perspective -->
    <path d="M60 380 L256 460 L452 380 L256 300 Z" fill="url(#mapGradient)" stroke="#CBD5E1" stroke-width="4"/>
    
    <!-- Grid Lines (Roads) -->
    <path d="M160 340 L352 420" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <path d="M352 340 L160 420" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 300 L256 460" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,8"/>
  </g>

  <!-- Red Location Pin -->
  <g filter="url(#shadow)" transform="translate(0, -40)">
    <path d="M256 40 C180 40 120 100 120 176 C120 280 256 420 256 420 C256 420 392 280 392 176 C392 100 332 40 256 40 Z" fill="#EF4444" />
    <circle cx="256" cy="176" r="60" fill="white" opacity="0.9" />
    <circle cx="256" cy="176" r="30" fill="#EF4444" />
  </g>
</svg>
